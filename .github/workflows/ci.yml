name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (macOS)
    # Needs the macOS 26 SDK: the Glass theme calls glassEffect, gated at runtime with
    # #available(macOS 26) but still has to compile against an SDK that has it.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Swift and SDK version
        run: |
          swift --version
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release
